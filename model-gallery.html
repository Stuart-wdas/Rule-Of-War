<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11150f" />
    <meta
      name="description"
      content="Standalone comparison gallery for the models folder." />
    <title>Army Commander Model Comparison</title>
    <link rel="stylesheet" href="model-gallery.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="gallery-shell">
      <header class="gallery-header">
        <div>
          <span class="eyebrow">MODEL INSPECTION / STANDALONE</span>
          <h1>Army Commander Comparison</h1>
          <p>Every file inside <code>models/</code>, shown at matched display height.</p>
        </div>
        <div class="gallery-controls" aria-label="Model display controls">
          <button id="toggle-rotation" type="button" aria-pressed="false">
            Pause rotation
          </button>
          <button id="toggle-wireframe" type="button" aria-pressed="false">
            Wireframe
          </button>
          <button id="reset-models" type="button">Reset views</button>
        </div>
      </header>

      <section
        class="model-grid"
        id="model-grid"
        aria-label="Model comparison"
        aria-live="polite"></section>

      <footer>
        Drag to orbit · Scroll to zoom · Duplicates remain visible for direct comparison
      </footer>
    </main>

    <template id="model-card-template">
      <article class="model-card">
        <header>
          <div>
            <span class="model-index"></span>
            <h2 class="model-name"></h2>
          </div>
          <span class="model-format"></span>
        </header>
        <div class="model-stage">
          <canvas></canvas>
          <span class="model-status">Loading model…</span>
          <span class="duplicate-badge" hidden></span>
        </div>
        <dl class="model-stats">
          <div><dt>Size</dt><dd data-stat="size">—</dd></div>
          <div><dt>Meshes</dt><dd data-stat="meshes">—</dd></div>
          <div><dt>Triangles</dt><dd data-stat="triangles">—</dd></div>
        </dl>
        <p class="model-file"></p>
      </article>
    </template>

    <script type="module" src="model-gallery.js"></script>
  </body>
</html>
